<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即時口譯字幕</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 投影用深色單一主題：上方控制列，下方大字幕區 */
:root{
  --bg:#0f1418; --panel:#182027; --line:#2a3640; --fg:#eef3f6; --muted:#8fa1ae;
  --a:#5cc8ff; --b:#ffc857; --rec:#ff5d5d;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
h1{font-size:18px;margin:0 8px 0 0;font-weight:700}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:13px;color:var(--muted)}
select,button{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--a);color:#06202e;font-weight:700}
.tagA{color:var(--a);font-weight:700}.tagB{color:var(--b);font-weight:700}
.spacer{flex:1}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px max(16px,env(safe-area-inset-left)) 16px max(16px,env(safe-area-inset-right));gap:16px}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-right:4px}
.item{border-left:4px solid var(--line);padding:4px 0 4px 16px}
.item.fromA{border-color:var(--a)}.item.fromB{border-color:var(--b)}
.src{color:var(--muted);font-size:clamp(14px,1.6vw,20px);margin-bottom:4px}
.dst{font-size:clamp(26px,4.2vw,56px);line-height:1.3;font-weight:500}
.fromA .dst{color:var(--b)}.fromB .dst{color:var(--a)}
.live{color:var(--muted);font-size:clamp(18px,2.4vw,30px);min-height:1.4em;font-style:italic}
.empty{color:var(--muted);font-size:18px;line-height:1.7;max-width:46em}
footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.mic{font-size:20px;font-weight:700;padding:16px 28px;border-radius:999px;border:2px solid var(--line);background:var(--panel);min-width:220px}
.mic.A{border-color:var(--a)}.mic.B{border-color:var(--b)}
.mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,93,93,.18)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.speakBtn{font-size:18px;font-weight:700;padding:14px 22px;border-radius:999px;border:2px solid var(--line);background:var(--panel);color:var(--muted)}
.speakBtn[aria-pressed="true"]{border-color:#5ee0a0;color:#5ee0a0}
#status{font-size:14px;color:var(--muted);text-align:center;width:100%}
.warn{color:var(--rec)}
body.fs header{display:none}
</style>
</head>
<body>
<header>
  <h1>即時口譯字幕</h1>
  <div class="group">
    <label>模式</label>
    <div class="seg" role="group">
      <button id="mDialog" aria-pressed="true">對話模式</button>
      <button id="mSpeech" aria-pressed="false">演講模式</button>
    </div>
  </div>
  <div class="group">
    <label for="langA"><span class="tagA">A</span> 語言</label><select id="langA"></select>
    <button id="swap" title="交換 A / B">⇄</button>
    <label for="langB"><span class="tagB">B</span> 語言</label><select id="langB"></select>
  </div>
  <div class="group" id="autoWrap">
    <label><input type="checkbox" id="auto" checked> 講完自動換另一方</label>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <button id="clear">清除字幕</button>
    <button id="full">全螢幕</button>
  </div>
</header>

<main>
  <div id="log">
    <div class="empty" id="empty">
      <p><b>對話模式：</b>按「<span class="tagA">A</span> 說話」或「<span class="tagB">B</span> 說話」開始。說 A 語言的內容會翻成 B，說 B 語言會翻成 A。勾選「講完自動換另一方」時，一句話翻完後會自動改聽另一種語言。</p>
      <p><b>演講模式：</b>按「開始聆聽」，講者說的 A 語言會持續翻成 B 語言顯示在螢幕上。</p>
      <p>請用 Chrome 或 Edge 開啟，第一次使用時允許麥克風權限。</p>
    </div>
  </div>
  <div class="live" id="live"></div>
  <footer id="controls"></footer>
  <div id="status"></div>
</main>

<script>
const LANGS = [
  {name:"中文",     rec:"zh-TW", tr:"zh-TW", tts:"zh-TW"},
  {name:"英文",     rec:"en-US", tr:"en",    tts:"en-US"},
  {name:"日文",     rec:"ja-JP", tr:"ja",    tts:"ja-JP"},
  {name:"韓文",     rec:"ko-KR", tr:"ko",    tts:"ko-KR"},
  {name:"馬來西亞文", rec:"ms-MY", tr:"ms",    tts:"ms-MY"},
  {name:"德文",     rec:"de-DE", tr:"de",    tts:"de-DE"},
  {name:"法文",     rec:"fr-FR", tr:"fr",    tts:"fr-FR"},
];
const $ = id => document.getElementById(id);
const selA = $("langA"), selB = $("langB");
LANGS.forEach((l,i)=>{ selA.add(new Option(l.name,i)); selB.add(new Option(l.name,i)); });
selA.value = 0; selB.value = 1;

let mode = "dialog";          // dialog | speech
let side = null;              // 目前聆聽的一方 "A" | "B" | null
let rec = null, wantOn = false, muted = false;
let speakOn = false;
try{ speakOn = localStorage.getItem("speakOn") === "1"; }catch(_){}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function status(t, warn){ $("status").textContent = t; $("status").className = warn ? "warn" : ""; }
if(!SR) status("這個瀏覽器不支援語音辨識，請改用電腦版 Chrome 或 Edge。", true);

function lang(s){ return LANGS[+(s==="A" ? selA.value : selB.value)]; }

/* ---------- 控制按鈕 ---------- */
function renderControls(){
  const c = $("controls"); c.innerHTML = "";
  if(mode === "dialog"){
    ["A","B"].forEach(s=>{
      const b = document.createElement("button");
      b.className = "mic " + s + (side===s ? " on" : "");
      b.textContent = (side===s ? "■ 停止（" : "● ") + s + " 說話：" + lang(s).name + (side===s ? "）" : "");
      b.onclick = ()=> side===s ? stop() : start(s);
      c.appendChild(b);
    });
  } else {
    const b = document.createElement("button");
    b.className = "mic A" + (side ? " on" : "");
    b.textContent = side ? "■ 停止聆聽" : "● 開始聆聽（" + lang("A").name + " → " + lang("B").name + "）";
    b.onclick = ()=> side ? stop() : start("A");
    c.appendChild(b);
  }
  const sp = document.createElement("button");
  sp.className = "speakBtn";
  sp.setAttribute("aria-pressed", speakOn);
  sp.textContent = speakOn ? "🔊 朗讀：開" : "🔇 朗讀：關";
  sp.title = "翻譯顯示時是否同時唸出來";
  sp.onclick = ()=>{
    speakOn = !speakOn;
    try{ localStorage.setItem("speakOn", speakOn ? "1" : "0"); }catch(_){}
    if(!speakOn && "speechSynthesis" in window) speechSynthesis.cancel();
    renderControls();
  };
  c.appendChild(sp);
  $("autoWrap").hidden = mode !== "dialog";
}

/* ---------- 語音辨識 ---------- */
/* 先用 getUserMedia 取得一次麥克風並一直保持開啟。
   之後語音辨識重新啟動時，瀏覽器看到同一頁已在使用麥克風，就不會再跳出權限詢問。 */
let micStream = null;
async function ensureMic(){
  if(micStream && micStream.getAudioTracks().some(t=>t.readyState==="live")) return true;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    return true;
  }catch(e){
    status("沒有麥克風權限。請在網址列左側允許麥克風後再試一次。", true);
    return false;
  }
}

async function start(s){
  if(!SR) return;
  if(selA.value === selB.value){ status("A 和 B 請選不同的語言。", true); return; }
  if(!(await ensureMic())) return;
  stopRec();
  side = s; wantOn = true; muted = false;
  rec = new SR();
  rec.lang = lang(s).rec;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e=>{
    if(muted) return;   // 朗讀中，忽略喇叭傳回來的聲音
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i];
      if(r.isFinal){
        const text = r[0].transcript.trim();
        if(text) handleFinal(text, s);
      } else interim += r[0].transcript;
    }
    $("live").textContent = interim ? "（" + lang(s).name + "）" + interim : "";
  };
  rec.onerror = e=>{
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      status("沒有麥克風權限。請在網址列左側允許麥克風後再試一次。", true); wantOn = false; side = null; renderControls();
    } else if(e.error !== "no-speech" && e.error !== "aborted"){
      status("語音辨識錯誤：" + e.error, true);
    }
  };
  rec.onend = ()=>{ if(wantOn && side===s) { try{ rec.start(); }catch(_){} } };
  try{ rec.start(); }catch(_){}
  status("正在聆聽 " + lang(s).name + "…");
  renderControls();
}
function stopRec(){ wantOn = false; if(rec){ rec.onend = null; try{ rec.abort(); }catch(_){} rec = null; } }
function stop(){ stopRec(); side = null; if("speechSynthesis" in window) speechSynthesis.cancel(); $("live").textContent = ""; status("已停止"); renderControls(); }

/* ---------- 翻譯 ---------- */
async function translate(text, from, to){
  try{
    const u = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+from+"&tl="+to+"&q="+encodeURIComponent(text);
    const j = await (await fetch(u)).json();
    return j[0].map(x=>x[0]).join("");
  }catch(_){
    const u = "https://api.mymemory.translated.net/get?langpair="+from+"|"+to+"&q="+encodeURIComponent(text);
    const j = await (await fetch(u)).json();
    return j.responseData.translatedText;
  }
}

async function handleFinal(text, s){
  const other = s==="A" ? "B" : "A";
  const from = lang(s), to = lang(other);
  $("empty")?.remove();
  const item = document.createElement("div");
  item.className = "item from" + s;
  item.innerHTML = '<div class="src"></div><div class="dst">翻譯中…</div>';
  item.querySelector(".src").textContent = s + "（" + from.name + "）：" + text;
  $("log").appendChild(item);
  $("log").scrollTop = $("log").scrollHeight;
  let out = "";
  try{
    out = await translate(text, from.tr, to.tr);
    item.querySelector(".dst").textContent = out;
  }catch(err){
    item.querySelector(".dst").textContent = "（翻譯失敗，請確認網路連線）";
  }
  $("log").scrollTop = $("log").scrollHeight;
  if(side !== s) return;  // 使用者已按停止或已切換
  const next = (mode==="dialog" && $("auto").checked) ? other : s;
  if(speakOn && out && "speechSynthesis" in window){
    // 朗讀時不關麥克風（關掉再開會重新詢問權限），改成暫時忽略聽到的內容
    muted = true;
    status("正在朗讀翻譯…");
    say(out, to.tts, ()=>{
      setTimeout(()=>{
        muted = false;
        if(side!==s) return;
        if(next !== s) start(next); else status("正在聆聽 " + lang(s).name + "…");
      }, 400);
    });
  } else if(next !== s){
    start(next);
  }
}

function say(t, l, done){
  const u = new SpeechSynthesisUtterance(t); u.lang = l;
  let finished = false;
  const end = ()=>{ if(!finished){ finished = true; done && done(); } };
  u.onend = end; u.onerror = end;
  speechSynthesis.speak(u);
}

/* ---------- 介面事件 ---------- */
function setMode(m){
  stop(); mode = m;
  $("mDialog").setAttribute("aria-pressed", m==="dialog");
  $("mSpeech").setAttribute("aria-pressed", m==="speech");
  renderControls();
}
$("mDialog").onclick = ()=>setMode("dialog");
$("mSpeech").onclick = ()=>setMode("speech");
selA.onchange = selB.onchange = ()=>{ if(side) stop(); renderControls(); };
$("swap").onclick = ()=>{ const t = selA.value; selA.value = selB.value; selB.value = t; selA.onchange(); };
$("clear").onclick = ()=>{ $("log").innerHTML = ""; };
$("full").onclick = ()=>{
  document.body.classList.add("fs");
  document.documentElement.requestFullscreen?.().catch(()=>{});
};
document.addEventListener("fullscreenchange", ()=>{ if(!document.fullscreenElement) document.body.classList.remove("fs"); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.body.classList.remove("fs"); });

renderControls();
</script>
</body>
</html>
